server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: savory-stay-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:savorystay_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    # No default on purpose: MYSQL_PASSWORD must come from the environment (see .env.example).
    # A committed password here leaked real credentials into the repository.
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    # SQL logging is OFF by default — the outbox poller queries every 3s and
    # show-sql:true turns that into constant console spam. Enable temporarily
    # with JPA_SHOW_SQL=true when you need to trace queries.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      # Shared rate-limit / lockout store. Optional at runtime: if Redis is down the
      # auth rate limiter fails OPEN (requests allowed) so an outage never blocks login.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Short timeouts so a slow/hung Redis fails fast into the fail-open path
      # instead of hanging authentication requests.
      timeout: 2s
      connect-timeout: 2s
  mail:
    # Gmail SMTP (smtp.gmail.com:587 with STARTTLS).
    # Credentials come from the environment (MAIL_USERNAME = Gmail address,
    # MAIL_PASSWORD = 16-char App Password from myaccount.google.com/apppasswords).
    # Without MAIL_PASSWORD, email falls back to demo mode (OTP logged to console).
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Hard timeouts so a slow/hung mail server never blocks a Kafka
          # consumer thread for long (they run with retry + DLT anyway).
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  profiles:
    # Default to 'local' profile which disables Kafka consumers.
    # Override with SPRING_PROFILES_ACTIVE=prod (or docker) when Kafka is running.
    active: ${SPRING_PROFILES_ACTIVE:local}
  kafka:
    # Kafka broker (single-node KRaft via docker-compose.yml by default).
    # localhost:29092 is the broker's HOST listener — dockerized clients
    # (kafka-ui) use the in-network listener (kafka:9092) instead.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:savorystay-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Consumers start even if a topic has not been created yet (topics are
      # auto-created by KafkaTopicConfig when the broker is reachable).
      missing-topics-fatal: false

app:
  kafka:
    # Set to true when Kafka broker is available (docker-compose.prod.yml
    # or local docker compose). When false, consumers don't start and the
    # outbox poller skips — no infinite connection-retry log spam.
    enabled: ${APP_KAFKA_ENABLED:false}
  name: SavoryStay
  # Public base URL used in email footers / links.
  url: ${APP_URL:http://localhost:5173}
  # P0.31: When true, OTP codes are returned in API responses even with real
  # email/SMS providers configured. Only enable for explicit demo/testing.
  demo:
    otp-expose: ${APP_DEMO_OTP_EXPOSE:true}
  # Restaurant business timezone — every pre-order cutoff / availability / closure
  # rule is evaluated in this zone (BusinessClock). Defaults to IST.
  business:
    timezone: ${BUSINESS_TIMEZONE:Asia/Kolkata}
  jwt:
    # No default on purpose: JWT_SECRET must come from the environment (see .env.example).
    # Generate with `openssl rand -hex 32` (>= 32 bytes). Without a configured secret
    # the app starts but rejects token signing/validation (fail-closed).
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours

security:
  rate-limit:
    max-login-failures: 5        # consecutive failures (per user/IP) before lockout
    failure-window-minutes: 15   # window in which failures accumulate
    lockout-minutes: 15          # how long a locked account/IP stays locked
    otp-send-max: 5              # max OTP dispatches per phone/email per window
    otp-send-window-minutes: 15
    otp-send-ip-max: 10          # max OTP dispatches per IP per hour
    otp-verify-max: 10           # max verify attempts per phone/email (or IP) per window

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:+14155238886}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_mock_secret_key_savorystay}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_stripe_webhook_secret}

paypal:
  client:
    id: ${PAYPAL_CLIENT_ID:mock_paypal_client_id}
    secret: ${PAYPAL_CLIENT_SECRET:mock_paypal_client_secret}
  mode: sandbox
