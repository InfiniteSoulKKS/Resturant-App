server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: savory-stay-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:savorystay_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: 9a2f8c4e7b1d0a3e5f6c8b9a1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e
    expiration-ms: 86400000 # 24 hours

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_mock_secret_key_savorystay}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_stripe_webhook_secret}

paypal:
  client:
    id: ${PAYPAL_CLIENT_ID:mock_paypal_client_id}
    secret: ${PAYPAL_CLIENT_SECRET:mock_paypal_client_secret}
  mode: sandbox
