# Docker Desktop 4.52+ ships Docker Engine v29, which enforces a minimum
# Docker API version of 1.44. docker-java negotiates an older API by default,
# and the daemon answers every call with HTTP 400 — which Testcontainers
# reports as "Could not find a valid Docker environment".
# Pinning the API version makes the local Testcontainers Redis test runnable
# on current Docker Desktop while remaining compatible with older daemons.
api.version=1.44
